input {
  jdbc {
    jdbc_driver_class => "org.postgresql.Driver"
    jdbc_driver_library => "/usr/share/logstash/logstash-core/lib/jars/postgresql-42.7.3.jar"

    # Service name "postgres" from docker-compose; DB name "mydb"
    jdbc_connection_string => "jdbc:postgresql://postgres:5432/mydb"
    jdbc_user              => "${DB_USER}"
    jdbc_password          => "${DB_PASSWORD}"

    # Incremental sync based on updated_at
    statement => "SELECT id, name, status, updated_at
                  FROM public.orders
                  WHERE updated_at > :sql_last_value
                  ORDER BY updated_at ASC"

    use_column_value       => true
    tracking_column        => "updated_at"
    tracking_column_type   => "timestamp"

    schedule               => "*/5 * * * *"  # every 5 minutes
    last_run_metadata_path => "/usr/share/logstash/.logstash_jdbc_last_run_orders"
    record_last_run        => true
    clean_run              => false

    jdbc_default_timezone  => "UTC"
  }
}

filter {
  mutate {
    rename => { "id" => "order_id" }
    convert => { "order_id" => "integer" }
  }

  date {
    match  => ["updated_at", "ISO8601"]
    target => "updated_at"
  }

  mutate {
    add_field => {
      "source_system" => "orders-db"
      "env"           => "${ENVIRONMENT}"
    }
  }
}

output {
  elasticsearch {
    hosts           => [ "http://elasticsearch:9200" ]
    index           => "orders-%{+YYYY.MM.dd}"
    document_id     => "%{order_id}"
    manage_template => false
    retry_on_conflict => 3
  }

  stdout {
    codec => rubydebug
  }
}

